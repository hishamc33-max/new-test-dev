# Uptime Kuma - Optimized Configuration for AWS t4g.small (2GB RAM)
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    ports:
      # Port mapping: <Host Port>:<Container Port>
      # Access in browser via http://<ec2-ip>:3001
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    environment:
      # Restrict Node.js V8 engine memory heap limit to 512MB (plenty for t4g.small while leaving ~1.5GB for your other site)
      - NODE_OPTIONS=--max-old-space-size=512
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=1
      - TZ=UTC
    deploy:
      resources:
        limits:
          memory: 768M   # Hard cap for container
        reservations:
          memory: 256M   # Guaranteed minimum RAM
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uptime-kuma-data:
