# Uptime Kuma - Low Memory Configuration for AWS t4g.nano (512MB RAM)
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    environment:
      # Restrict Node.js V8 engine memory heap limit to 128MB
      # Forces aggressive Garbage Collection before memory grows
      - NODE_OPTIONS=--max-old-space-size=128
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=1
      - TZ=UTC
    deploy:
      resources:
        limits:
          memory: 180M   # Absolute hard cap for container
        reservations:
          memory: 64M    # Guaranteed minimum RAM
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  uptime-kuma-data:
